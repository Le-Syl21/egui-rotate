[package]
name = "egui-rotate"
version = "4.0.0"
edition = "2021"
rust-version = "1.92"
authors = ["Sylvain Gargasson <sylvain.gargasson@gmail.com>"]
description = "Viewport rotation (0/90/180/270°) for egui as a plugin — transparent per-window input/output rotation and a rotated software cursor."
keywords = ["egui", "rotation", "viewport", "kiosk", "pinball"]
categories = ["gui", "graphics"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Le-Syl21/egui-rotate"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
software-cursor = []
serde = ["dep:serde", "egui/serde"]
# Wire `egui_inspection` (the protocol behind `egui_mcp`) into a rotated
# app — the helper enforces the plugin ordering that keeps injected
# logical-space events out of the rotation path.
inspection = ["dep:egui_inspection"]

[dependencies]
# Pinned to a single egui minor: each one has moved the `Plugin` surface this
# crate implements (0.35 gave `input_hook`/`output_hook` a `&Context`), so one
# code base cannot span two. egui 0.37 -> egui-rotate 4.x, 0.36 -> 3.x,
# 0.35 -> 2.x, 0.34 -> 1.x.
egui = { version = ">=0.37, <0.38", default-features = false }
# Optional: serve the egui_inspection protocol (egui_mcp & friends) with
# rotation-aware plugin ordering. See `src/inspection.rs`.
egui_inspection = { version = "0.37", optional = true, features = ["plugin"] }
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
egui = ">=0.37, <0.38"
egui_glow = ">=0.37, <0.38"
egui-winit = ">=0.37, <0.38"
glutin = "0.32"
glutin-winit = "0.5"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }

[[example]]
name = "rotated_demo"
required-features = ["software-cursor"]

[[example]]
name = "plugin_demo"
required-features = ["software-cursor"]

